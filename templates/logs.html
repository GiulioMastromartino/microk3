{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-list-alt me-2"></i>System Logs</h2>
    <div>
        <span class="text-muted small me-2">Showing last 100 lines</span>
        <a href="/logs" class="btn btn-outline-primary btn-sm">
            <i class="fas fa-sync-alt me-1"></i> Refresh
        </a>
    </div>
</div>

<div class="card bg-dark text-light">
    <div class="card-header border-secondary d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="fas fa-terminal me-2"></i>Console Output</h5>
        <div class="status-indicator status-active"></div>
    </div>
    <div class="card-body p-0">
        <div class="log-viewer p-3" style="height: 600px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.9rem;">
            {% if logs %}
                {% for line in logs %}
                <div class="log-line text-light border-bottom border-secondary py-1" style="border-opacity: 0.2;">
                    {{ line }}
                </div>
                {% endfor %}
            {% else %}
                <div class="text-muted text-center py-5">
                    No logs available.
                </div>
            {% endif %}
        </div>
    </div>
</div>

<style>
    /* Custom Scrollbar for Logs */
    .log-viewer::-webkit-scrollbar {
        width: 8px;
    }
    .log-viewer::-webkit-scrollbar-track {
        background: #2c3e50;
    }
    .log-viewer::-webkit-scrollbar-thumb {
        background: #95a5a6;
        border-radius: 4px;
    }
    .log-viewer::-webkit-scrollbar-thumb:hover {
        background: #7f8c8d;
    }
</style>
{% endblock %}
